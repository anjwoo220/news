name: Daily Job Crawler

on:
  schedule:
    # 매일 자정 (UTC) 00:00 -> 한국 시간(KST) 오전 9:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread oauth2client google-generativeai playwright
          # JobsDB (SPA) 파싱을 위해 Playwright 브라우저 설치 필요
          playwright install chromium
          
      - name: Run Crawler
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawl_jobs.py
